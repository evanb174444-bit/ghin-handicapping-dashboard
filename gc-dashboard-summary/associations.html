<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GC Association Membership Totals</title>
<style>
:root{--bg:#f5f7fb;--card:#fff;--ink:#111827;--muted:#64748b;--line:#d7dee9;--navy:#14395f;--green:#15803d;--red:#b91c1c;--blue-head:#dbe7f6}*{box-sizing:border-box}body{margin:0;background:transparent;font-family:Arial,Helvetica,sans-serif;color:var(--ink)}main{width:100%;padding:0}.heading{margin:0 0 14px;padding:0 2px}.heading h1{margin:0;font-size:25px;line-height:1.15}.heading p{margin:6px 0 0;color:var(--muted);font-size:12px}.summary{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-bottom:16px}.metric{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:15px 17px}.metric span{display:block;color:var(--muted);font-size:10px;font-weight:900;letter-spacing:.06em;text-transform:uppercase}.metric strong{display:block;margin-top:7px;color:var(--navy);font-size:25px}.table-shell{overflow:auto;border:1px solid var(--line);border-radius:16px;background:#fff}.table-note{padding:12px 14px;color:var(--muted);font-size:11px;line-height:1.5;font-weight:400}table{width:100%;border-collapse:separate;border-spacing:0;min-width:1050px}th,td{border-right:1px solid #e4eaf1;border-bottom:1px solid #e4eaf1;padding:13px 14px}th:last-child,td:last-child{border-right:0}thead tr:first-child th{background:#edf2f7;color:#52647d;font-size:11px;letter-spacing:.08em;text-transform:uppercase;text-align:left}thead tr:first-child th:nth-child(n+3){text-align:right}th button{width:100%;border:0;background:transparent;color:inherit;padding:0;font:inherit;font-weight:950;text-align:inherit;cursor:pointer}th button:hover{color:#0f2d52}tbody td{font-size:13px;font-weight:850;text-align:right}tbody tr:nth-child(even){background:#fbfcfe}tbody tr:hover{background:#f1f6fc}.rank{width:72px;text-align:center!important;color:#334155}.association{text-align:left!important;color:#14395f;font-weight:950}.change-column{background:#f8f9fa}thead tr:first-child th.change-column{background:#f3f4f6}tbody tr:hover td.change-column{background:#f1f3f5}.positive{color:var(--green)}.negative{color:var(--red)}.neutral{color:var(--muted)}@media(max-width:700px){.summary{grid-template-columns:1fr}.heading h1{font-size:22px}}
</style>
</head>
<body>
<main>
  <div class="heading"><h1>GC Association Membership Totals</h1><p>Click any column heading to sort; rank recalculates after every sort. October membership comparison. YoY change compares active memberships with the prior year. % share is each association’s portion of the current total.</p></div>
  <section class="summary" id="summary"></section>
  <div class="table-shell"><table><thead id="columns"></thead><tbody id="rows"></tbody></table></div><div class="table-note" id="period" role="status">Loading GC association data…</div>
</main>
<script>
let data=[],years=[],sortKey="active",sortDir=-1;const fmt=n=>n==null?"—":Math.round(Number(n)||0).toLocaleString(),pct=n=>n==null?"—":`${(n*100).toFixed(1)}%`,clean=s=>s.replace(/^USGA\//,"").replace(/ GC$/,"").replace("GSGA","Georgia State GA").replace("GAP","Golf Association of Philadelphia").replace("MGA","Metropolitan GA").replace("SCGA","Southern California GA").replace("VSGA","Virginia State GA").replace("GAM","Golf Association of Michigan"),norm=s=>s.toLowerCase().replace(/golf association/g,"").replace(/\b(state|amateur|golf|ga|gc|eclub)\b/g,"").replace(/\W/g,"");
const aliases={northernnevada:"nevada",southernnevada:"nevada",pr:"puertorico",asga:"arkansas",csga:"connecticut",coloradostate:"colorado",gap:"gap",philadelphia:"gap",ofphiladelphia:"gap",gsga:"georgia",gam:"michigan",idahoeclub:"idaho",mga:"metropolitan",metamateur:"metropolitanamateur",miamivalley:"miamivalleygolf",ncga:"northerncalifornia",nh:"newhampshire",nj:"newjersey",nysga:"newyork",rdga:"rochesterdistrict",ri:"rhodeisland",scga:"southerncalifornia",vsga:"virginia",wisconsin:"wisconsin",ofwisconsin:"wisconsin",wyoming:"wyomingstatecolorado",wyomingstate:"wyomingstatecolorado",wyomingcolorado:"wyomingstatecolorado",marylanddc:"maryland",ohioga:"ohio"};
const canonical=["Idaho Golf Association","Texas Golf Association","Southern California Golf Association","Montana State Golf Association","Florida State Golf Association","Greater Cincinnati Golf Association","Rochester District Golf Association","Alabama Golf Association","GAP","Iowa Golf Association","Northern California Golf Association","Mass Golf","Colorado Golf Association","Central Links Golf","Virginia State Golf Association","North Dakota Golf Association","Western Pennsylvania Golf Association","New York State Golf Association","Oklahoma Golf Association","Indiana Golf Association","Arkansas State Golf Association","Mississippi Golf Association","South Dakota Golf Association","Sun Country Amateur Golf Association","Metropolitan Golf Association","Missouri Golf Association","Kentucky Golf Association","Ohio Golf Association","Northern Ohio Golf Association","Metropolitan Amateur Golf Association","Miami Valley Golf","Nevada Golf","Connecticut State Golf Association","Utah Golf Association","West Virginia Golf Association","Vermont Golf Association","Georgia State Golf Association","Golf Association of Michigan","Wyoming State / Colorado GA","Chicago District Golf Association","Hawaii State Golf Association","Nebraska Golf Association","Washington Golf","Golf Association of Wisconsin","Louisiana Golf Association","Maryland State Golf Association","Alaska Golf Association","Rhode Island Golf Association","New Hampshire Golf Association","Tennessee Golf Association","New Jersey Golf","Arizona Golf Association","Maine State Golf Association","Carolinas Golf Association","Oregon Golf Association","Minnesota Golf Association","Puerto Rico Golf Association"];
const signedPct=n=>n==null?"—":`${n>0?"+":""}${pct(n)}`;
function render(){
 const sorted=[...data].sort((a,b)=>sortKey==="name"?sortDir*a.name.localeCompare(b.name):sortDir*((a[sortKey]??-Infinity)-(b[sortKey]??-Infinity)));
 document.getElementById("rows").innerHTML=sorted.map((r,i)=>`<tr><td class="rank">${i+1}</td><td class="association"><span>${r.name}</span></td>${years.map((year,j)=>`${j?`<td class="change-column ${r["growth"+year]==null?'neutral':r["growth"+year]>=0?'positive':'negative'}">${signedPct(r["growth"+year])}</td>`:""}<td>${fmt(r["count"+year])}</td>`).join("")}<td class="change-column ${r.twoYearChange==null?'neutral':r.twoYearChange>=0?'positive':'negative'}">${signedPct(r.twoYearChange)}</td><td>${pct(r.share)}</td></tr>`).join("");
}
const keyFor=name=>/metropolitan amateur|met amateur/i.test(name)?"metropolitanamateur":aliases[norm(clean(name))]||norm(clean(name));
Promise.all(["data/segmentation_status.json","data/association_history.json"].map(url=>fetch(url,{cache:"no-store"}).then(r=>{if(!r.ok)throw new Error(`HTTP ${r.status}`);return r.json()}))).then(([rows,history])=>{
  const valid=rows.filter(r=>r.clubName&&r.clubName!=="All"&&r.activeGolfers!=null);
  const latestPeriod=Math.max(...valid.map(r=>r.year*12+r.monthNum));
  const latest=valid.filter(r=>r.year*12+r.monthNum===latestPeriod);
  const reportDate=new Date(latest[0].reportDate),year=reportDate.getFullYear();
  const monthDay=`${String(reportDate.getMonth()+1).padStart(2,"0")}-${String(reportDate.getDate()).padStart(2,"0")}`;
  const snapshots=history.snapshots.filter(s=>s.date.endsWith(monthDay)&&Number(s.date.slice(0,4))<year).map(s=>({...s,year:Number(s.date.slice(0,4))}));
  const total=latest.reduce((sum,r)=>sum+r.activeGolfers,0);
  snapshots.push({year,totalActive:total,associations:latest.map(r=>({name:r.clubName,active:r.activeGolfers}))});
  snapshots.sort((a,b)=>a.year-b.year);years=snapshots.map(s=>s.year);
  const counts=new Map(snapshots.map(s=>{const map=new Map();for(const r of s.associations){const key=keyFor(r.name);map.set(key,(map.get(key)||0)+r.active)}return [s.year,map]}));
  data=canonical.map(name=>{const key=keyFor(name),row={name};for(const y of years){row["count"+y]=counts.get(y).get(key)??null;const previous=counts.get(y-1)?.get(key);row["growth"+y]=row["count"+y]!=null&&previous>0?row["count"+y]/previous-1:null}row.active=row["count"+year];const twoYearsAgo=row["count"+(year-2)];row.twoYearChange=row.active!=null&&twoYearsAgo>0?row.active/twoYearsAgo-1:null;row.share=row.active!=null&&total>0?row.active/total:null;return row});
  for(const snapshot of snapshots){if(data.reduce((sum,r)=>sum+(r["count"+snapshot.year]||0),0)!==snapshot.totalActive)throw new Error(`Association totals do not reconcile for ${snapshot.year}`)}
  document.getElementById("columns").innerHTML=`<tr><th><button data-sort="rank">Rank ↕</button></th><th><button data-sort="name">Association ↕</button></th>${years.map((y,i)=>`${i?`<th class="change-column"><button data-sort="growth${y}" title="Percentage change from ${y-1} to ${y}">% change ↕</button></th>`:""}<th><button data-sort="count${y}">${y} GC Golfers ↕</button></th>`).join("")}<th class="change-column"><button data-sort="twoYearChange" title="Percentage change from ${year-2} to ${year}">2 year change ↕</button></th><th><button data-sort="share" title="Share of current active memberships">${year} % share ↕</button></th></tr>`;
  document.getElementById("period").textContent=`October membership comparison: ${years.join(", ")}. Historical Nevada counts combine Northern and Southern Nevada. A dash indicates unavailable history or a zero prior-year count.`;
  document.getElementById("summary").innerHTML=snapshots.map(s=>{const prior=snapshots.find(p=>p.year===s.year-1);return `<article class="metric"><span>Active GC Golfers · ${s.year}</span><strong>${fmt(s.totalActive)}</strong>${prior?`<div style="margin-top:6px;font-size:13px">${signedPct(s.totalActive/prior.totalActive-1)} vs. ${prior.year}</div>`:""}</article>`}).join("");
  render();
}).catch(e=>{const status=document.getElementById("period");status.hidden=false;status.textContent=`Unable to load association data: ${e.message}`});

document.getElementById("columns").addEventListener("click",event=>{const button=event.target.closest("[data-sort]");if(!button)return;const key=button.dataset.sort;if(key==="rank"){sortKey="active";sortDir=-1}else if(sortKey===key)sortDir*=-1;else{sortKey=key;sortDir=key==="name"?1:-1}render()});
</script>
</body>
</html>
