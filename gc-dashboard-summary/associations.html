<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GC Association Membership Totals</title>
<style>
:root{--bg:#f5f7fb;--card:#fff;--ink:#111827;--muted:#64748b;--line:#d7dee9;--navy:#14395f;--green:#15803d;--red:#b91c1c;--blue-head:#dbe7f6}*{box-sizing:border-box}body{margin:0;background:transparent;font-family:Arial,Helvetica,sans-serif;color:var(--ink)}main{width:100%;padding:0}.heading{margin:0 0 14px;padding:0 2px}.heading h1{margin:0;font-size:25px;line-height:1.15}.heading p{margin:6px 0 0;color:var(--muted);font-size:12px}.summary{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-bottom:16px}.metric{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:15px 17px}.metric span{display:block;color:var(--muted);font-size:10px;font-weight:900;letter-spacing:.06em;text-transform:uppercase}.metric strong{display:block;margin-top:7px;color:var(--navy);font-size:25px}.table-shell{overflow:auto;border:1px solid var(--line);border-radius:16px;background:#fff}.table-note{padding:12px 14px;border-bottom:1px solid var(--line);color:var(--muted);font-size:11px;font-weight:800}table{width:100%;border-collapse:separate;border-spacing:0;min-width:820px}th,td{border-right:1px solid #e4eaf1;border-bottom:1px solid #e4eaf1;padding:13px 14px}th:last-child,td:last-child{border-right:0}thead tr:first-child th{background:#edf2f7;color:#52647d;font-size:11px;letter-spacing:.08em;text-transform:uppercase;text-align:left}thead tr:first-child th.group{background:#d7e4f5;color:#315987;text-align:center}thead tr:nth-child(2) th{background:#f4f7fa;color:#315987;font-size:11px;text-align:right}th[rowspan]{vertical-align:middle}th button{width:100%;border:0;background:transparent;color:inherit;padding:0;font:inherit;font-weight:950;text-align:inherit;cursor:pointer}th button:hover{color:#0f2d52}tbody td{font-size:13px;font-weight:850;text-align:right}tbody tr:nth-child(even){background:#fbfcfe}tbody tr:hover{background:#f1f6fc}.rank{width:72px;text-align:center!important;color:#334155}.association{text-align:left!important;color:#14395f;font-weight:950}.association span{border-bottom:1px solid #8aa5c0}.positive{color:var(--green)}.negative{color:var(--red)}.neutral{color:var(--muted)}@media(max-width:700px){.summary{grid-template-columns:1fr}.heading h1{font-size:22px}}
</style>
</head>
<body>
<main>
  <div class="heading"><h1>GC Association Membership Totals</h1><p>Click any column heading to sort; rank recalculates after every sort.</p></div>
  <section class="summary" id="summary"></section>
  <div class="table-shell"><div class="table-note" id="period">Loading GC association data…</div><table><thead><tr><th rowspan="2"><button data-sort="rank">Rank ↕</button></th><th rowspan="2"><button data-sort="name">Association ↕</button></th><th colspan="5" class="group">Active totals</th></tr><tr><th><button data-sort="active">GC Golfers ↕</button></th><th><button data-sort="hcp">Total HCP Golfers* ↕</button></th><th><button data-sort="share">Share of Membership* ↕</button></th><th><button data-sort="change">YTD Trend ↕</button></th><th><button data-sort="trend3">3-Year Trend* ↕</button></th></tr></thead><tbody id="rows"></tbody></table></div>
</main>
<script>
let data=[],sortKey="active",sortDir=-1;const fmt=n=>n==null?"—":Math.round(Number(n)||0).toLocaleString(),pct=n=>n==null?"—":`${(n*100).toFixed(1)}%`,clean=s=>s.replace(/^USGA\//,"").replace(/ GC$/,"").replace("GSGA","Georgia State GA").replace("GAP","Golf Association of Philadelphia").replace("MGA","Metropolitan GA").replace("SCGA","Southern California GA").replace("VSGA","Virginia State GA").replace("GAM","Golf Association of Michigan"),norm=s=>s.toLowerCase().replace(/golf association/g,"").replace(/\b(state|amateur|golf|ga|gc|eclub)\b/g,"").replace(/\W/g,"");
const aliases={asga:"arkansas",csga:"connecticut",coloradostate:"colorado",gap:"gap",philadelphia:"gap",ofphiladelphia:"gap",gsga:"georgia",gam:"michigan",idahoeclub:"idaho",mga:"metropolitan",metamateur:"metropolitanamateur",miamivalley:"miamivalleygolf",ncga:"northerncalifornia",nh:"newhampshire",nj:"newjersey",nysga:"newyork",rdga:"rochesterdistrict",ri:"rhodeisland",scga:"southerncalifornia",vsga:"virginia",wisconsin:"wisconsin",ofwisconsin:"wisconsin",wyoming:"wyomingstatecolorado",wyomingstate:"wyomingstatecolorado",wyomingcolorado:"wyomingstatecolorado",marylanddc:"maryland",ohioga:"ohio"};
const canonical=["Idaho Golf Association","Texas Golf Association","Southern California Golf Association","Montana State Golf Association","Florida State Golf Association","Greater Cincinnati Golf Association","Rochester District Golf Association","Alabama Golf Association","GAP","Iowa Golf Association","Northern California Golf Association","Mass Golf","Colorado Golf Association","Central Links Golf","Virginia State Golf Association","North Dakota Golf Association","Western Pennsylvania Golf Association","New York State Golf Association","Oklahoma Golf Association","Indiana Golf Association","Arkansas State Golf Association","Mississippi Golf Association","South Dakota Golf Association","Sun Country Amateur Golf Association","Metropolitan Golf Association","Missouri Golf Association","Kentucky Golf Association","Ohio Golf Association","Northern Ohio Golf Association","Metropolitan Amateur Golf Association","Miami Valley Golf","Nevada Golf","Connecticut State Golf Association","Utah Golf Association","West Virginia Golf Association","Vermont Golf Association","Georgia State Golf Association","Golf Association of Michigan","Wyoming State / Colorado GA","Chicago District Golf Association","Hawaii State Golf Association","Nebraska Golf Association","Washington Golf","Golf Association of Wisconsin","Louisiana Golf Association","Maryland State Golf Association","Alaska Golf Association","Rhode Island Golf Association","New Hampshire Golf Association","Tennessee Golf Association","New Jersey Golf","Arizona Golf Association","Maine State Golf Association","Carolinas Golf Association","Oregon Golf Association","Minnesota Golf Association","Puerto Rico Golf Association"];
function hcpRows(){try{return parent.getAssociationRows().map(r=>({name:r.name,hcp:r.activeGolfers}))}catch(e){return []}}
function matchedHcp(name,rows){const key=aliases[norm(name)]||norm(name),exact=rows.find(r=>norm(r.name)===key);if(exact)return exact.hcp;const fuzzy=rows.find(r=>norm(r.name).includes(key)||key.includes(norm(r.name)));return fuzzy?.hcp??null}
function render(){const trend=n=>n==null?"—":`${n>0?"▲ ":n<0?"▼ ":""}${pct(Math.abs(n))}`,sorted=[...data].sort((a,b)=>{if(sortKey==="name")return sortDir*a.name.localeCompare(b.name);return sortDir*((a[sortKey]??-1)-(b[sortKey]??-1))});document.getElementById("rows").innerHTML=sorted.map((r,i)=>`<tr><td class="rank">${i+1}</td><td class="association"><span>${r.name}</span></td><td>${fmt(r.active)}</td><td>${fmt(r.hcp)}</td><td>${pct(r.share)}</td><td class="${r.change>0?"positive":r.change<0?"negative":"neutral"}">${trend(r.change)}</td><td class="${r.trend3>0?"positive":r.trend3<0?"negative":"neutral"}">${trend(r.trend3)}</td></tr>`).join("")}
fetch("data/segmentation_status.json?v=20261002").then(r=>r.json()).then(rows=>{const valid=rows.filter(r=>r.clubName&&r.clubName!=="All"&&r.activeGolfers!=null),latestNum=Math.max(...valid.map(r=>r.monthNum)),latest=valid.filter(r=>r.monthNum===latestNum),janRows=valid.filter(r=>r.monthNum===1),sourceByKey=new Map(latest.map(r=>[aliases[norm(clean(r.clubName))]||norm(clean(r.clubName)),r])),janByKey=new Map(janRows.map(r=>[aliases[norm(clean(r.clubName))]||norm(clean(r.clubName)),r.activeGolfers])),total=latest.reduce((s,r)=>s+r.activeGolfers,0),denominators=hcpRows();data=canonical.map(name=>{const key=name==="Metropolitan Amateur Golf Association"?"metropolitanamateur":aliases[norm(name)]||norm(name),source=sourceByKey.get(key),active=source?.activeGolfers??null,jan=janByKey.get(key),seed=[...name].reduce((s,c)=>s+c.charCodeAt(0),0),trend3=(8+(seed%241)/10)/100,hcp=matchedHcp(name,denominators);return {name,active,hcp,change:active!=null&&jan?active/jan-1:null,trend3,share:active!=null&&hcp?active/hcp:null}});const overallHcp=3367613,overallShare=total/overallHcp;document.getElementById("period").textContent=`${data.length} GC associations · ${latest[0]?.reportDate||latest[0]?.label||"Latest report"} · Association roster validated against the September 2 golfer-detail export · *association-level HCP totals, membership shares, and 3-year trends use placeholder data`;document.getElementById("summary").innerHTML=`<article class="metric"><span>Active GC Golfers</span><strong>${fmt(total)}</strong></article><article class="metric"><span>Active HCP Golfers</span><strong>${fmt(overallHcp)}</strong></article><article class="metric"><span>GC Share of Membership</span><strong>${pct(overallShare)}</strong></article>`;render()}).catch(e=>document.getElementById("period").textContent=`Unable to load association data: ${e.message}`);
document.querySelectorAll("[data-sort]").forEach(b=>b.addEventListener("click",()=>{const k=b.dataset.sort;if(k==="rank")sortKey="active";else if(sortKey===k)sortDir*=-1;else{sortKey=k;sortDir=k==="name"?1:-1}render()}));
</script>
</body>
</html>
